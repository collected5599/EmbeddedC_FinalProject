<text x="408" y="708" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#e3ecef">main.c schedules · app coordinates · FSM decides · drivers touch hardware · GUI visualizes telemetry</text>
<text x="90" y="750" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#f0c15a">USART1 accepts the QSPI read request only; no state/actuator commands. Heater and pump are simulated.</text>
