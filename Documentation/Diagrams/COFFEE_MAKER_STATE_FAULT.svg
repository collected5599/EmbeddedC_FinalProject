<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101a25"/><stop offset="1" stop-color="#09111a"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#edf2ef"/><stop offset="1" stop-color="#bcc9c9"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".26"/></filter>
 <style>
 .title{font:700 44px 'Segoe UI',Arial,sans-serif;fill:#f2f7f8}.sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#9eb2be}.card{fill:#172633;stroke:#2b4050;stroke-width:2}
 .label{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#eff5f6}.body{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#c4d2d9}.small{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#aabcc6}.micro{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#f4eeee}
 .green{fill:#57d58b}.yellow{fill:#f0c45d}.red{fill:#fb6d71}.off{fill:#344751}.teal{fill:#58d6c6}
 </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<text x="70" y="76" class="title">COFFEE MAKER · FAULT RESPONSE</text>
<text x="72" y="114" class="sub">Any safety fault stops the virtual heater and pump, turns on the fault indicator, and holds until recovery is acknowledged.</text>

<g filter="url(#shadow)">
 <rect x="70" y="160" width="920" height="760" rx="24" class="card"/>
 <rect x="1030" y="160" width="820" height="760" rx="24" class="card"/>
</g>
<text x="108" y="218" class="label">WHAT CAN TRIGGER FAULT?</text>
<text x="1068" y="218" class="label">WHAT THE MACHINE DOES</text>

<!-- cause cards -->
<g>
 <rect x="105" y="258" width="850" height="126" rx="18" fill="#223542"/>
 <circle cx="157" cy="321" r="31" fill="#563237"/><path d="M157 298 L157 326 M157 342 L157 344" stroke="#ff9a9d" stroke-width="7" stroke-linecap="round"/>
 <text x="211" y="304" class="label">NO CUP · FAULT_NO_CUP</text><text x="211" y="341" class="body">ToF detects cup absent for ≥200 ms while heating or brewing.</text>
 <rect x="105" y="408" width="850" height="126" rx="18" fill="#223542"/>
 <circle cx="157" cy="471" r="31" fill="#563237"/><path d="M140 481 Q157 448 174 481 M157 451 L157 470" fill="none" stroke="#ff9a9d" stroke-width="5"/>
 <text x="211" y="454" class="label">OVER-TEMPERATURE · FAULT_OVERTEMP</text><text x="211" y="491" class="body">Pot-simulated water temperature rises above 102 °C.</text>
 <rect x="105" y="558" width="850" height="126" rx="18" fill="#223542"/>
 <circle cx="157" cy="621" r="31" fill="#563237"/><circle cx="157" cy="621" r="18" fill="none" stroke="#ff9a9d" stroke-width="5"/><path d="M157 607 L157 623 L169 630" fill="none" stroke="#ff9a9d" stroke-width="5" stroke-linecap="round"/>
 <text x="211" y="604" class="label">HEATING TIMEOUT · FAULT_HEAT_TIMEOUT</text><text x="211" y="641" class="body">Target temperature not reached within 180 seconds.</text>
 <rect x="105" y="708" width="850" height="126" rx="18" fill="#223542"/>
 <circle cx="157" cy="771" r="31" fill="#563237"/><path d="M139 759 L175 783 M175 759 L139 783" stroke="#ff9a9d" stroke-width="6" stroke-linecap="round"/>
 <text x="211" y="754" class="label">SENSOR COMMUNICATION · FAULT_SENSOR_COMM</text><text x="211" y="791" class="body">ADC or ToF data unavailable; ToF retries initialization every 2 s.</text>
</g>
<text x="108" y="875" class="small">No tank-level sensor is installed; TANK_EMPTY is not generated by this hardware build.</text>

<!-- fault machine -->
<g filter="url(#shadow)">
 <rect x="1265" y="276" width="350" height="390" rx="22" fill="url(#metal)" stroke="#f5f7f4" stroke-width="3"/>
 <rect x="1288" y="300" width="304" height="100" rx="12" fill="#243844"/>
 <rect x="1302" y="314" width="72" height="72" rx="7" fill="#163b48"/><path d="M1310 357 Q1339 335 1367 356 L1367 376 L1310 376Z" fill="#28798a"/>
 <circle cx="1420" cy="332" r="11" class="off"/><circle cx="1459" cy="332" r="11" class="off"/><circle cx="1498" cy="332" r="11" class="red"/><circle cx="1537" cy="332" r="11" class="green"/>
 <text x="1420" y="374" class="micro">FAULT</text>
 <rect x="1375" y="422" width="128" height="34" rx="6" fill="#9caeb1"/><rect x="1418" y="456" width="42" height="87" fill="#2b4048"/>
 <path d="M1358 570 L1520 570 L1508 640 Q1439 662 1370 640Z" fill="#f1f3ef" stroke="#c5d0d0" stroke-width="3"/><path d="M1520 580 Q1555 578 1553 601 Q1551 625 1515 614" fill="none" stroke="#c5d0d0" stroke-width="8"/>
</g>
<text x="1072" y="716" class="body">RED PA4 · fault LED blinks 4 Hz</text>
<text x="1072" y="750" class="body">GREEN PB14 · heartbeat continues at 1 Hz</text>
<text x="1072" y="784" class="body">READY PB4 and HEATING PB1 · OFF</text>
<text x="1072" y="818" class="body">Virtual HEATER = 0% · virtual PUMP = OFF</text>
<rect x="1068" y="850" width="744" height="42" rx="12" fill="#4c282f"/>
<text x="1440" y="878" text-anchor="middle" class="small">FAULT remains latched until a valid recovery action</text>

<rect x="70" y="953" width="1780" height="92" rx="18" fill="#193541"/>
<text x="100" y="989" class="body">RECOVERY</text>
<text x="235" y="989" class="small">NO_CUP: restore cup · OVERTEMP: cool below 80 °C · SENSOR_COMM: valid sensors and zero errors · HEAT_TIMEOUT: condition is clearable.</text>
<text x="235" y="1021" class="small">Press PD14 (Start/Cancel) to acknowledge a clearable fault; PC13 (Power) returns the controller to STANDBY.</text>
</svg>
