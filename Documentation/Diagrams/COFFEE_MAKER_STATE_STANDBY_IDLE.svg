<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101a25"/><stop offset="1" stop-color="#09111a"/></linearGradient>
  <linearGradient id="machine" x2="0" y2="1"><stop stop-color="#edf2ef"/><stop offset="1" stop-color="#bcc9c9"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
  <style>
    .title{font:700 46px 'Segoe UI',Arial,sans-serif;fill:#f2f7f8}.sub{font:400 21px 'Segoe UI',Arial,sans-serif;fill:#9eb2be}
    .card{fill:#172633;stroke:#2b4050;stroke-width:2}.label{font:700 26px 'Segoe UI',Arial,sans-serif;fill:#eff5f6}
    .body{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#c4d2d9}.small{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#aabcc6}
    .chip{fill:#203341;stroke:#355264;stroke-width:1.5}.chiphead{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#a9c1cb}.chipbody{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#edf4f5}
    .green{fill:#57d58b}.yellow{fill:#f0c45d}.red{fill:#fb6d71}.off{fill:#344751}.teal{fill:#58d6c6}
    .mtext{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#eaf1f2}.state{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#aec2cb}
  </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<text x="70" y="76" class="title">COFFEE MAKER · STARTUP AND IDLE</text>
<text x="72" y="116" class="sub">Follow the physical controls, cup sensor, and board indicators as the controller wakes into standby and enters idle.</text>

<!-- Shared input strip -->
<g filter="url(#shadow)">
  <rect x="60" y="150" width="340" height="145" rx="18" class="chip"/>
  <circle cx="105" cy="210" r="25" fill="#304858" stroke="#9db4bf" stroke-width="3"/><circle cx="105" cy="210" r="13" fill="#dce5e5"/>
  <text x="145" y="190" class="chiphead">POWER BUTTON</text><text x="145" y="221" class="chipbody">PC13 · onboard B1</text><text x="85" y="268" class="small">Press to leave STANDBY</text>
  <rect x="425" y="150" width="340" height="145" rx="18" class="chip"/>
  <rect x="455" y="186" width="54" height="50" rx="8" fill="#304858" stroke="#9db4bf" stroke-width="2"/><circle cx="482" cy="211" r="13" fill="#dce5e5"/>
  <text x="530" y="190" class="chiphead">START / CANCEL</text><text x="530" y="221" class="chipbody">PD14 · D2</text><text x="450" y="268" class="small">Press to request a brew</text>
  <rect x="790" y="150" width="340" height="145" rx="18" class="chip"/>
  <path d="M835 232 L875 190 L915 232" fill="none" stroke="#d7e1e3" stroke-width="7" stroke-linecap="round"/><circle cx="875" cy="190" r="8" fill="#58d6c6"/>
  <text x="940" y="190" class="chiphead">STRENGTH SELECTOR</text><text x="940" y="221" class="chipbody">PA3 · Normal / Strong</text><text x="815" y="268" class="small">SPDT contact to GND selects Strong</text>
  <rect x="1155" y="150" width="340" height="145" rx="18" class="chip"/>
  <circle cx="1208" cy="213" r="30" fill="#d8e0df" stroke="#82959a" stroke-width="3"/><path d="M1208 213 L1225 196" stroke="#172633" stroke-width="4" stroke-linecap="round"/><path d="M1187 231 A28 28 0 0 1 1230 190" fill="none" stroke="#58d6c6" stroke-width="4"/>
  <text x="1260" y="190" class="chiphead">TEMPERATURE POT</text><text x="1260" y="221" class="chipbody">PC5 · ADC1_IN14</text><text x="1180" y="268" class="small">Simulated water input: 20–110 °C</text>
  <rect x="1520" y="150" width="340" height="145" rx="18" class="chip"/>
  <rect x="1550" y="190" width="48" height="39" rx="5" fill="#263c4a" stroke="#6f8a97" stroke-width="2"/><circle cx="1574" cy="209" r="8" fill="#58d6c6"/><path d="M1602 203 Q1620 209 1602 215 M1610 195 Q1640 209 1610 223" fill="none" stroke="#58d6c6" stroke-width="3"/>
  <path d="M1650 197 Q1674 187 1697 197 L1693 223 Q1674 235 1654 223 Z" fill="#f0f3ee" stroke="#c3d0d0" stroke-width="2"/><path d="M1698 202 Q1714 200 1714 210 Q1714 221 1694 219" fill="none" stroke="#c3d0d0" stroke-width="4"/>
  <text x="1730" y="190" class="chiphead">CUP SENSOR</text><text x="1730" y="221" class="chipbody">VL53L0X · I2C2</text><text x="1545" y="268" class="small">Onboard ToF checks cup distance</text>
</g>

<!-- state cards -->
<g filter="url(#shadow)">
 <rect x="60" y="345" width="850" height="625" rx="24" class="card"/>
 <rect x="1010" y="345" width="850" height="625" rx="24" class="card"/>
</g>
<text x="95" y="397" class="label">01 · STANDBY</text><text x="95" y="431" class="body">MCU is running; the coffee cycle is logically off.</text>
<text x="1045" y="397" class="label">02 · IDLE</text><text x="1045" y="431" class="body">Ready for a brew request; sensors remain active.</text>

<!-- standby coffee machine -->
<g filter="url(#shadow)">
 <rect x="170" y="480" width="330" height="355" rx="20" fill="url(#machine)" stroke="#f6f8f5" stroke-width="3"/>
 <rect x="192" y="500" width="286" height="88" rx="12" fill="#243844"/>
 <rect x="204" y="512" width="70" height="64" rx="7" fill="#163b48"/><path d="M211 550 Q238 530 267 548 L267 568 L211 568 Z" fill="#28798a"/>
 <circle cx="315" cy="530" r="10" class="off"/><circle cx="351" cy="530" r="10" class="off"/><circle cx="387" cy="530" r="10" class="off"/><circle cx="423" cy="530" r="10" class="green"/>
 <text x="294" y="565" class="mtext">STANDBY</text>
 <rect x="270" y="603" width="130" height="32" rx="6" fill="#a9b9bb"/><rect x="314" y="635" width="42" height="73" fill="#283b45"/><rect x="284" y="707" width="103" height="12" rx="4" fill="#182832"/>
 <path d="M254 746 L414 746 L400 804 Q334 826 268 804 Z" fill="#eef1ec" stroke="#c4d0ce" stroke-width="3"/><path d="M414 757 Q447 753 445 775 Q443 798 405 792" fill="none" stroke="#c4d0ce" stroke-width="8"/>
</g>
<text x="190" y="864" class="state">READY PB4: OFF</text><text x="190" y="891" class="state">HEATING PB1: OFF · FAULT PA4: OFF</text>
<text x="190" y="918" class="state">HEARTBEAT PB14: GREEN · BLINK 1 Hz</text>

<!-- transition arrow -->
<path d="M810 626 L1012 626" stroke="#58d6c6" stroke-width="6" marker-end="url(#arr)"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58d6c6"/></marker></defs>
<rect x="815" y="548" width="190" height="55" rx="14" fill="#203744"/><text x="910" y="583" text-anchor="middle" class="small">PRESS B1 · PC13</text>

<!-- idle coffee machine -->
<g filter="url(#shadow)">
 <rect x="1125" y="480" width="330" height="355" rx="20" fill="url(#machine)" stroke="#f6f8f5" stroke-width="3"/>
 <rect x="1147" y="500" width="286" height="88" rx="12" fill="#243844"/>
 <rect x="1159" y="512" width="70" height="64" rx="7" fill="#163b48"/><path d="M1166 550 Q1193 530 1222 548 L1222 568 L1166 568 Z" fill="#28798a"/>
 <circle cx="1269" cy="530" r="10" class="green"/><circle cx="1305" cy="530" r="10" class="off"/><circle cx="1341" cy="530" r="10" class="off"/><circle cx="1377" cy="530" r="10" class="green"/>
 <text x="1274" y="565" class="mtext">IDLE</text>
 <rect x="1225" y="603" width="130" height="32" rx="6" fill="#a9b9bb"/><rect x="1269" y="635" width="42" height="73" fill="#283b45"/><rect x="1239" y="707" width="103" height="12" rx="4" fill="#182832"/>
 <path d="M1209 746 L1369 746 L1355 804 Q1289 826 1223 804 Z" fill="#eef1ec" stroke="#c4d0ce" stroke-width="3"/><path d="M1369 757 Q1402 753 1400 775 Q1398 798 1360 792" fill="none" stroke="#c4d0ce" stroke-width="8"/>
</g>
<text x="1145" y="864" class="state">READY PB4: ON ONLY IF CUP + TARGET TEMP</text>
<text x="1145" y="891" class="state">HEATING PB1: OFF · FAULT PA4: OFF</text>
<text x="1145" y="918" class="state">HEARTBEAT PB14: GREEN · BLINK 1 Hz</text>

<rect x="60" y="997" width="1800" height="48" rx="14" fill="#193541"/>
<text x="84" y="1028" class="small">START SAFETY: pressing PD14 with no valid cup reading or no cup present is ignored. All heater/pump behavior shown in later steps is simulated in software.</text>
</svg>
